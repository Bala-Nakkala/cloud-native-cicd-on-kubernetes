backend:
  type: opensearch

config:
  outputs: |
    [OUTPUT]
        Name opensearch
        Match *
        Host opensearch-cluster-master.logging.svc.cluster.local
        Port 9200
        HTTP_User admin
        HTTP_Passwd DevOps@2026#123
        tls On
        tls.verify Off
        Index kubernetes-logs
        Suppress_Type_Name On

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        Tag kube.*
        Parser cri
        Refresh_Interval 5

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log On